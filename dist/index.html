<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c141b">
  <meta name="description" content="美中双方从 250 公里起始间隔进行 AI 对战模拟、188 个真实现代装备型号、舰载航空与后勤；附三个真实海岸线历史单人任务。">
  <title>Sea Power · 海空战模拟平台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=0.6.1">
</head>
<body>
  <main class="workspace">
    <section class="map-panel" aria-label="战术海图">
      <canvas id="map" tabindex="0" aria-label="2D 战术海图：点击单位选择，右键海域设置航点；也可使用面板的航线按钮。"></canvas>
      <div id="result" class="result hidden"></div>
      <div id="mode-banner" class="mode-banner hidden"></div>
    </section>
  </main>

  <section id="mission-widget" class="hud-widget is-collapsed" data-widget="mission" aria-label="剧本组件">
    <div class="widget-heading" data-widget-drag="mission"><span>剧本</span><span class="mission-status"><span class="dot"></span><span id="phase">部署阶段</span></span><button data-widget-toggle="mission" aria-label="展开剧本组件" aria-expanded="false" aria-controls="mission-body">⌄</button></div>
    <div id="mission-body" class="widget-body" inert>
      <button id="scenario" class="scenario-name">海峡交锋 <span>⌄</span></button><p id="mission-subtitle" class="mission-subtitle">联合编队 · 对海与防空</p>
      <label class="weather-label">海况 <select id="weather" aria-label="海况"><option value="clear">晴朗 / 2 级</option><option value="storm">风暴 / 6 级</option></select></label>
      <label class="check-row"><input type="checkbox" id="all-auto"> 蓝方全队自动交战</label>
      <button id="auto-battle-mission" class="outline wide auto-entry">美中 AI 对战 · 250 公里起始 ↗</button><button id="catalog-mission" class="outline wide mechanics-button">现代装备库 · 188 型 ↗</button><button id="mechanics" class="outline wide mechanics-button">作战机制与平衡</button>
      <button id="history-brief" class="outline wide mechanics-button hidden">历史背景与任务简报</button>
      <div id="mission-objectives" class="mission-objectives"></div>
      <div id="briefing" class="briefing"><p id="brief-text"></p><button id="begin" class="primary wide">开始推演 ↗</button></div>
    </div>
  </section>

  <section id="mission-strip" class="mission-strip hidden" aria-label="历史任务目标">
    <div class="mission-strip-heading"><strong id="mission-strip-title"></strong><span id="mission-remaining"></span><button id="mission-strip-toggle" aria-label="收放任务目标" aria-expanded="true">⌃</button></div>
    <div class="mission-strip-content"><div id="mission-strip-objectives"></div><div class="mission-strip-actions"><button id="mission-brief">查看简报</button><button id="mission-order" class="primary">执行任务</button></div></div>
  </section>

  <section id="autobattle-widget" class="hud-widget is-collapsed hidden" data-widget="autobattle" aria-label="AI 对战观察组件">
    <div class="widget-heading" data-widget-drag="autobattle"><span>AI 对战</span><span id="auto-remaining" class="auto-remaining">部署双方</span><button data-widget-toggle="autobattle" aria-label="展开 AI 对战组件" aria-expanded="false" aria-controls="autobattle-body">⌄</button></div>
    <div id="autobattle-body" class="widget-body" inert></div>
  </section>

  <section id="time-widget" class="hud-widget" data-widget="time" aria-label="推演组件">
    <div class="widget-heading" data-widget-drag="time"><span>推演</span><span class="clock" id="clock">00:00:00</span><button data-widget-toggle="time" aria-label="收起推演组件" aria-expanded="true" aria-controls="time-body">⌃</button></div>
    <div id="time-body" class="widget-body clock-control"><button id="play" class="play" title="开始或暂停推演（空格）" aria-label="开始推演">▶</button><div class="time-speeds" aria-label="时间倍率"><button data-speed="1">1×</button><button data-speed="10" class="active">10×</button><button data-speed="30">30×</button><button data-speed="120">120×</button></div></div>
  </section>

  <section id="fleet-widget" class="hud-widget" data-widget="fleet" aria-label="舰队组件">
    <div class="widget-heading" data-widget-drag="fleet"><span>舰队</span><button data-widget-toggle="fleet" aria-label="收起舰队组件" aria-expanded="true" aria-controls="fleet-body">⌃</button></div>
    <div id="fleet-body" class="widget-body fleet-panel">
      <div class="panel-tabs"><button id="fleet-tab" class="active">蓝方编队 <span id="fleet-count">3</span></button><button id="contacts-tab">接触 <span id="contact-count">0</span></button></div>
      <div class="fleet-summary"><span id="list-heading">作战单位</span><span id="budget">部署点 38</span></div>
      <div id="unit-list" class="unit-list"></div>
      <div class="fleet-bottom"><button id="deploy" class="outline wide">＋ 部署单位</button><div class="legend"><span><i class="blue-symbol"></i> 蓝方</span><span><i class="red-symbol"></i> 红方接触</span></div></div>
    </div>
  </section>

  <section id="inspector-widget" class="hud-widget is-collapsed" data-widget="inspector" aria-label="单位控制组件">
    <div class="widget-heading" data-widget-drag="inspector"><span>单位控制</span><span id="selection-summary" class="widget-summary"></span><button data-widget-toggle="inspector" aria-label="展开单位控制组件" aria-expanded="false" aria-controls="inspector-body">⌄</button></div>
    <div id="inspector-body" class="widget-body" inert><aside id="inspector" class="inspector"></aside></div>
  </section>

  <section id="view-widget" class="hud-widget is-collapsed" data-widget="view" aria-label="海图工具组件">
    <div class="widget-heading" data-widget-drag="view"><span>海图工具</span><button data-widget-toggle="view" aria-label="展开海图工具组件" aria-expanded="false" aria-controls="view-body">⌄</button></div>
    <div id="view-body" class="widget-body" inert><div class="layers"><button data-layer="sensors" class="active" title="切换雷达与声呐探测范围">探测圈</button><button data-layer="trails" title="显示历史航迹">航迹</button><button data-layer="grid" class="active" title="切换坐标网格">网格</button></div><div class="view-bottom"><span id="coordinates">X 120.0 &nbsp; Y 85.0 nm</span><div class="zoom-controls"><button id="zoom-out" aria-label="缩小海图">−</button><button id="zoom-fit" title="显示整个海域">全图</button><button id="zoom-in" aria-label="放大海图">＋</button></div></div><p id="map-hint" class="map-hint">点击选择 · 右键航点 · 滚轮缩放 · 拖动平移</p></div>
  </section>

  <section id="log-widget" class="hud-widget is-collapsed" data-widget="log" aria-label="作战记录组件">
    <div class="widget-heading" data-widget-drag="log"><span>作战记录</span><button data-widget-toggle="log" aria-label="展开作战记录组件" aria-expanded="false" aria-controls="log-body">⌄</button></div>
    <div id="log-body" class="widget-body" inert><div id="events" class="events" aria-live="polite"></div></div>
  </section>

  <nav class="hud-dock" aria-label="组件控制台"><button id="dock-toggle" aria-label="收起组件控制台" aria-expanded="true" aria-controls="dock-tools">☷</button><div id="dock-tools"><button id="auto-battle" class="auto-dock-entry">AI 对战</button><button data-widget-toggle="mission">剧本</button><button data-widget-toggle="fleet">舰队</button><button data-widget-toggle="inspector">单位</button><button data-widget-toggle="view">海图</button><button data-widget-toggle="log">记录</button><button data-widget-toggle="time">推演</button><span class="dock-divider"></span><button id="collapse-all">全部收起</button><span class="dock-divider"></span><button id="catalog">装备库</button><button id="save" title="保存到当前浏览器">保存</button><button id="load">载入</button><button id="export" title="导出当前战局 JSON">导出</button><button id="help" aria-label="操作指南">?</button></div></nav>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script type="module" src="./app.js?v=0.6.1"></script>
</body>
</html>
